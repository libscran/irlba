on:
  push:
    branches:
      - master
  pull_request:

name: Run unit tests

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Ubuntu Latest GCC, debug, coverage enabled", 
            os: ubuntu-latest,
            cov: true
          }
        - {
            name: "macOS Latest Clang, debug", 
            os: macos-latest,
          }
        - {
            name: "Ubuntu Latest GCC, release", 
            os: ubuntu-latest,
            release: true
          }
        - {
            name: "macOS Latest Clang, release", 
            os: macos-latest,
            release: true 
          }

    steps:
    - uses: actions/checkout@v7

    - name: Get latest CMake
      uses: lukka/get-cmake@latest

    - name: Configure release build
      if: ${{ matrix.config.release }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure the build with coverage
      if: ${{ matrix.config.cov }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCODE_COVERAGE=ON

    - name: Configure debug Mac build
      if: ${{ !matrix.config.release && matrix.config.os == 'macos-latest' }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Run the build
      run: cmake --build build

    - name: Run the tests
      run: |
        cd build
        ctest --rerun-failed --output-on-failure

    - name: Generate code coverage
      if: ${{ matrix.config.cov }}
      run: |
        cd build/tests/CMakeFiles/libtest.dir/src/
        gcov -abcfu *.gcno

    - name: Upload to Codecov
      if: ${{ matrix.config.cov }}
      uses: codecov/codecov-action@v7
      with:
        directory: build/tests/CMakeFiles/libtest.dir/src/
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
